<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6EB4FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stickflip" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Stickflip: a tap-to-play stick figure skateboarding game." />
    <title>Stickflip</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Share previews (Messages, Slack, X...). Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stickflip" />
    <meta property="og:title" content="Stickflip" />
    <meta property="og:description" content="A tap-to-play stick figure skateboarding game. Tap to ollie, tap to grind, swipe to flip." />
    <meta property="og:url" content="https://stickflip.itschefff.com/" />
    <meta property="og:image" content="https://stickflip.itschefff.com/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stickflip title over a stick figure skater jumping toward a rail" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stickflip" />
    <meta name="twitter:description" content="A tap-to-play stick figure skateboarding game. Tap to ollie, tap to grind, swipe to flip." />
    <meta name="twitter:image" content="https://stickflip.itschefff.com/icons/og-image.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Anything the canvas doesn't cover (phone status bar, home-indicator
         strip, rubber-band scrolling) shows blue above and black ground below. */
      html {
        background: linear-gradient(#6EB4FF 50%, #000 50%) fixed;
        background-color: #000;
      }
      canvas {
        position: fixed;
        left: 0;
        top: 0;
      }
      canvas {
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
        image-rendering: pixelated;
      }
      #err {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: 8px;
        padding: 8px;
        background: #000;
        color: #ff5555;
        font: 14px monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Stickflip game. Tap or press space to play."></canvas>
    <div id="err" hidden></div>
    <script>
      // If the game fails to start, show why instead of a blank screen.
      function showError(msg) {
        var el = document.getElementById('err');
        el.hidden = false;
        el.textContent = 'STICKFLIP ERROR: ' + msg + ' (try reloading)';
      }
      window.addEventListener('error', function (e) {
        // A failed file load (script, module) has a target with a src.
        if (e.target && e.target.src) return showError('could not load ' + e.target.src);
        // Only the game's own code (our src/*.js files) puts an error on screen.
        // Browsers inject scripts of their own (Brave's wallet sets
        // window.ethereum, content blockers, extensions, analytics), and those
        // report as this page or a bare "Script error." with no file.
        var own = /\/src\/[\w\/-]+\.js/;
        var where = (e.filename || '') + ' ' + ((e.error && e.error.stack) || '');
        if (where.indexOf(location.origin) === -1 || !own.test(where)) return;
        showError(e.message || 'unknown');
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        showError(String(e.reason));
      });
    </script>
    <!-- GoatCounter analytics: counts only the live site, not /unstable or local copies. -->
    <script>
      if (location.hostname === 'stickflip.itschefff.com' && !location.pathname.startsWith('/unstable')) {
        // Count the page without the ?v= the update check adds.
        window.goatcounter = { path: () => location.pathname };
        const gc = document.createElement('script');
        gc.async = true;
        gc.src = 'https://gc.zgo.at/count.js';
        gc.dataset.goatcounter = 'https://stickflip.goatcounter.com/count';
        document.head.appendChild(gc);
      }
    </script>
    <script type="module" src="src/main.js" onerror="showError('could not load the game code')"></script>
  </body>
</html>
