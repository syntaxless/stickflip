<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000080" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Stickflip: a tap-to-play stick figure skateboarding game." />
    <title>Stickflip</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000080;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
        image-rendering: pixelated;
      }
      #err {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: 8px;
        padding: 8px;
        background: #000;
        color: #ff5555;
        font: 14px monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Stickflip game. Tap or press space to play."></canvas>
    <div id="err" hidden></div>
    <script>
      // If the game fails to start, show why instead of a blank screen.
      function showError(msg) {
        var el = document.getElementById('err');
        el.hidden = false;
        el.textContent = 'STICKFLIP ERROR: ' + msg + ' (try reloading)';
      }
      window.addEventListener('error', function (e) {
        showError(e.message || (e.target && e.target.src ? 'could not load ' + e.target.src : 'unknown'));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        showError(String(e.reason));
      });
    </script>
    <script type="module" src="src/main.js" onerror="showError('could not load the game code')"></script>
  </body>
</html>
