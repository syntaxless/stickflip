name: Deploy to GitHub Pages

# Publishes one site with both branches:
#   main     -> https://stickflip.itschefff.com/
#   unstable -> https://stickflip.itschefff.com/unstable/
# Runs after CI passes on a push to either branch. workflow_run jobs run in the
# default branch's context, so the github-pages environment accepts the deploy
# whichever branch triggered it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, unstable]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: unstable
          path: unstable
      - name: Assemble site
        run: |
          mkdir -p _site/unstable
          # Copy each branch, putting its code in a folder named after the commit
          # (src-<sha>/) so phones never mix cached old files with new ones.
          copy() {
            local from=$1 to=$2 v
            v=$(git -C "$from" rev-parse --short HEAD)
            [ -e "$from/index.html" ] || return 0
            cp "$from/index.html" "$to/"
            if [ -d "$from/src" ]; then
              cp -r "$from/src" "$to/src-$v"
              sed -i "s#src=\"src/main.js\"#src=\"src-$v/main.js\"#" "$to/index.html"
            fi
          }
          copy main _site
          copy unstable _site/unstable
          cp main/CNAME _site/ 2>/dev/null || true
          grep -o 'src-[0-9a-f]*/main.js' _site/index.html _site/unstable/index.html
          find _site -maxdepth 2 | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
